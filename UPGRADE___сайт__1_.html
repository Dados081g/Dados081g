const WEAR = {'Factory New':'FN','Minimal Wear':'MW','Field-Tested':'FT','Well-Worn':'WW','Battle-Scarred':'BS'};
const WMUL = {FN:1,MW:.85,FT:.6,WW:.5,BS:.45};

const SCALE = 500, PMIN = 3, PMAX = 1000000000, PEXP = 1.36;  // PEXP растягивает цены: самые дорогие скины доходят до 1 000 000 000
const USD = {rarity_common:.04,rarity_uncommon:.09,rarity_rare:.35,rarity_mythical:1.6,rarity_legendary:9,rarity_ancient:40,rarity_contraband:2500};
const HOT = {'Dragon Lore':9000,'Gungnir':5200,'Medusa':1700,'Howl':2600,'Fire Serpent':1000,'Pandora\'s Box':9000,'Hedge Maze':3200,'Emerald Web':1700,'Superconductor':1100,'Vice':900,'Cool Mint':700};
const KM = {'Fade':2.2,'Doppler':1.4,'Marble Fade':1.8,'Case Hardened':2.5,'Crimson Web':1.8,'Tiger Tooth':1.5,'Slaughter':1.3,'Gamma Doppler':1.5,'Lore':2.5,'Autotronic':1.6,'Black Laminate':1.6,'Freehand':1.2,'Ultraviolet':.7,'Safari Mesh':.45,'Boreal Forest':.45,'Forest DDPAT':.45,'Scorched':.45,'Urban Masked':.45,'Night Stripe':.5,'Stained':.55,'Blue Steel':.7};
const hash = str => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; };
function priceFor(key, rid, pat, kind, w, st, sv){
  let usd;
  if (kind === 'knife') usd = 220 * (KM[pat] || 1);
  else if (kind === 'glove') usd = HOT[pat] || 350;
  else usd = HOT[pat] || USD[(rid || '').replace(/_weapon$/, '')] || 1;
  let p = usd * SCALE * (WMUL[w] || .6) * (st ? 1.8 : 1) * (sv ? 2.5 : 1) * (.8 + .4 * hash(key));
  p = PMIN * Math.pow(Math.max(p, PMIN) / PMIN, PEXP);
  return Math.round(Math.min(PMAX, Math.max(PMIN, p)) * 100) / 100;
}
function buildItems(data, startId, manual){
  const out = [], imgs = {}; let id = startId;
  for (const sk of data) {
    const nm = sk.name || '', parts = nm.split(' | ');
    const weapon = (sk.weapon && sk.weapon.name) || parts[0].replace('★ ', '');
    const star = nm.startsWith('★') ? '★ ' : '';
    const kind = /Gloves|Wraps/.test(nm) ? 'glove' : (star ? 'knife' : 'gun');
    const pat = (sk.pattern && sk.pattern.name) || parts[1] || 'Vanilla';
    imgs[weapon + '|' + pat] = sk.image;
    const c = sk.rarity && sk.rarity.color, rid = sk.rarity && sk.rarity.id;
    const wears = (sk.wears && sk.wears.length) ? sk.wears.map(w => WEAR[w.name]).filter(Boolean) : [null];
    const variants = sk.souvenir ? [[false, true]] : (sk.stattrak ? [[false, false], [true, false]] : [[false, false]]);
    for (const w of wears) for (const [st, sv] of variants) {

}
async function loadSkins(){

    let data = null;

                     'https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/skins.json',
                     'https://cdn.jsdelivr.net/gh/ByMykel/CSGO-API@main/public/api/en/skins.json']) {
      try { const r = await fetch(u); if (r.ok) { data = await r.json(); break; } } catch (e) {}
    }
    if (!data) throw new Error('no skins');
    const manual = new Set(shop.filter(i => i.g !== 's').map(i => {
      const st = i.t.startsWith('StatTrak™'), sv = i.t.startsWith('Souvenir');
      return `${i.t.replace(/^(StatTrak™|Souvenir) ?/, '')}|${i.n}|${i.w || null}|${st}|${sv}`;
    }));
    const {out, imgs} = buildItems(data, 1000, manual);
    shop.forEach(i => { if (i.g !== 's' && !i.img) i.img = imgs[i.t.replace(/^(StatTrak™|Souvenir) ?/, '') + '|' + i.n]; });
    out.forEach(i => shop.push(i));
  } catch (e) {
    // нет доступа к базе скинов (например, в превью) — демо-каталог с ценами от 3 до 1 000 000 000
    const W = ['AK-47','M4A4','AWP','Glock-18','USP-S','Desert Eagle','MP9','P250','SSG 08','AUG','Five-SeveN','MAC-10','FAMAS','Galil AR','SG 553','Tec-9'];

    const T = [['#b0c3d9',3],['#5e98d9',30],['#4b69ff',300],['#8847ff',3000],['#d32ce6',100000],['#eb4b4b',10000000],['#e4ae39',200000000]];
    const N = 2500, WS = ['BS','WW','FT','MW','FN'];
    for (let i = 0; i < N; i++) {
      const p = Math.round(3 * Math.pow(PMAX / PMIN, i / (N - 1)) * (.97 + .06 * hash('f' + i)) * 100) / 100;
      const c = T.filter(t => p >= t[1]).pop() || T[0];
      shop.push({id: 1000 + i, n: P[i % P.length], t: (i % 7 === 0 ? 'StatTrak™ ' : '') + W[(i * 7) % W.length], w: WS[i % 5], p: Math.min(PMAX, p), c: c[0], g: i % 3 ? 'r' : 'p'});

(function(){ const seen = new Set(); let fixed = false; mine.forEach(i => { if (seen.has(i.id)) { i.id = nextId(); fixed = true; } seen.add(i.id); }); if (fixed) save(); })();

const chance = () => lock != null ? lock : (!target || !stake()) ? 50 : Math.max(.01, Math.min(95, stake() / target.p * 100 * (1 - EDGE / 100)));

// режим икса / процента: подбирает скин, чтобы шанс был ровно 100/x (x2 = 50%) или p%
function applyMode(){
  if (!mode) return;
  const st = stake();
  if (!st) { target = null; lock = null; return; }
  const want = mode.t === 'x' ? st * mode.v : st * 100 / mode.v;
  let best = null, bd = Infinity;
  for (const i of shop) { if (i.p <= st) continue; const d = Math.abs(i.p - want); if (d < bd) { bd = d; best = i; } }
  target = best;
  lock = (best && bd / want <= .01) ? (mode.t === 'x' ? 100 / mode.v : mode.v) : null;
}
function refresh(){ if (mode) applyMode(); render(); }

// риски вокруг шкалы
(function(){ let h=''; for(let a=0;a<360;a+=7.5){ const r=a%30===0?5:3, rad=a*Math.PI/180, x1=150+145*Math.sin(rad), y1=150-145*Math.cos(rad), x2=150+(145+r)*Math.sin(rad), y2=150-(145+r)*Math.cos(rad); h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2c2c30" stroke-width="1"/>`;} $('ticks').innerHTML=h; })();

function arc(r, deg){
  if (deg <= 0) return '';
  deg = Math.min(deg, 359.9);
  const a1 = (90 - deg/2) * Math.PI/180, a2 = (90 + deg/2) * Math.PI/180;
  return `M${150+r*Math.cos(a1)} ${150+r*Math.sin(a1)} A${r} ${r} 0 ${deg>180?1:0} 1 ${150+r*Math.cos(a2)} ${150+r*Math.sin(a2)}`;
}
function chevs(up){
  const f = ['#85700b','#fad40a','#85700b'], y = [0,40,92];
  return `<svg class="chev" viewBox="0 0 100 148" style="height:calc(var(--u)*148)"><g ${up?'transform="translate(0 148) scale(1 -1)"':''}>` +
    [0,1,2].map(i => `<use href="#chv" y="${y[i]}" width="100" height="56" fill="${f[i]}"/>`).join('') + `</g></svg>`;
}
function drawQuick(){
  const on = (t,v) => mode && mode.t === t && mode.v === v ? 'on' : '';
  $('quick').innerHTML = cfg.x.map(v => `<button data-t="x" data-v="${v}" class="${on('x',v)}">x${v}</button>`).join('')
    + cfg.p.map((v,i) => `<button data-t="p" data-v="${v}" class="${['a','b','c'][i]} ${on('p',v)}">${v}%</button>`).join('')
    + `<button class="gear" id="gear" aria-label="Настройки">${GEAR}</button>`;
}

    ? `<div class="it"><div class="im">${s.length ? vis(s[0]) : '<svg width="90" height="90" fill="#fad40a"><use href="#hex"/></svg>'}</div><div style="font-weight:500;font-size:calc(var(--u)*28)">${s.length ? (s.length>1 ? 'Скинов: '+s.length : s[0].n) : 'Баланс'}</div><div class="pr">${fmt(stake())} ${hex('#fad40a')}</div></div>`
    : `<div class="glow"></div><svg class="gun"><use href="#gun"/></svg><h4>Выберите скины или скины и баланс для использования</h4><p>Вы можете выбрать несколько скинов</p>${chevs(false)}`;

    ? `<div class="it"><div class="im">${vis(target)}</div><div style="font-weight:500;font-size:calc(var(--u)*28)">${target.n}</div><div class="pr">${fmt(target.p)} ${hex('#fad40a')}</div></div>`
    : `<div class="glow"></div><svg class="gun"><use href="#gun"/></svg><h4>Выберите скин для апгрейда</h4>${chevs(true)}`;

  const max = Math.floor(balance);
  $('sl').max = max; $('sl').value = add; $('sl').disabled = busy; $('bv').textContent = fmt(add); $('bm').textContent = fmt2(max);

  const items = tab === 'want' ? shop : (sub === 'skins' ? mine : shop);
  const isShop = items === shop, isInv = tab === 'mine' && sub === 'skins';
  $('filters').style.display = isShop ? 'flex' : 'none';
  $('su').setAttribute('fill', asc ? '#fff' : '#585a60'); $('sd').setAttribute('fill', asc ? '#585a60' : '#fff');

  $('sellrow').style.display = isInv ? 'flex' : 'none';
  $('sellrow').innerHTML = `<button class="sbtn" data-a="sells" ${picked.length?'':'disabled'}>Продать выбранные (${picked.length})${picked.length?' · '+fmt(round2(pickSum)):''}</button><button class="sbtn y" data-a="sellall" ${mine.length?'':'disabled'}>Продать все${mine.length?' · '+fmt(round2(allSum)):''}</button>`;

  let view = items.slice();

    const q = fq.trim().toLowerCase(), lo = parseFloat(fmin), hi = parseFloat(fmax);
    view = view.filter(i => (!q || (i.n + ' ' + i.t).toLowerCase().includes(q)) && (isNaN(lo) || i.p >= lo) && (isNaN(hi) || i.p <= hi));
    view.sort((a,b) => asc ? a.p - b.p : b.p - a.p);
  }

    return `<div class="sk ${on?'on':''}" data-id="${i.id}" style="--c:${col(i)}"><div class="pr">${fmtC(i.p)} ${hex('#fad40a')}</div>${i.w?`<div class="w">${i.w}</div>`:''}<div class="im">${vis(i)}</div><div class="t">${i.t}</div><div class="n">${i.n}</div></div>`;
  }).join('');
  const emptyMsg = !isShop ? 'У вас пока нет скинов. Сделайте апгрейд баланса или купите скин в магазине' : (loading ? 'Загружаем скины CS2…' : 'Ничего не найдено');
  $('list').innerHTML = (html || `<div class="empty">${emptyMsg}</div>`) + (view.length > limit ? '<div id="more" class="empty" style="padding:20px 0;grid-column:1/-1">Показать ещё</div>' : '');
  io.disconnect(); const mo = $('more'); if (mo) { io.observe(mo); mo.onclick = () => { limit += 60; render(); }; }

// ---------- звуки (синтезируются прямо в браузере, файлы не нужны) ----------
let _ac = null;
const ac = () => { try { _ac = _ac || new (window.AudioContext || window.webkitAudioContext)(); if (_ac.state === 'suspended') _ac.resume(); } catch (e) {} return _ac; };
function beep(t0, f1, f2, dur, vol, type){
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f1, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfxAdd(){ const a = ac(); if (!a) return; const t = a.currentTime; beep(t, 520, 760, 0.09, 0.16, 'triangle'); beep(t + 0.07, 780, 1040, 0.12, 0.14, 'triangle'); }
function sfxBuy(){
  const a = ac(); if (!a) return; const t = a.currentTime;
  beep(t, 1319, 0, 0.35, 0.16, 'triangle'); beep(t + 0.09, 1760, 0, 0.55, 0.15, 'triangle'); beep(t + 0.09, 3520, 0, 0.3, 0.05, 'sine');
  for (let i = 0; i < 5; i++) beep(t + 0.2 + i * 0.045, 2400 + Math.random() * 1200, 0, 0.07, 0.05, 'square');   // звон монет
}
// кривая как у CSS cubic-bezier(.12,.6,.1,1): по доле пути находим момент времени
const bez = (p, a, b) => 3 * (1 - p) * (1 - p) * p * a + 3 * (1 - p) * p * p * b + p * p * p;
function timeAt(prog){ let lo = 0, hi = 1; for (let k = 0; k < 24; k++) { const m = (lo + hi) / 2; bez(m, .6, 1) < prog ? lo = m : hi = m; } return bez((lo + hi) / 2, .12, .1); }
function sfxSpin(delta){
  const a = ac(); if (!a) return; const t = a.currentTime, N = Math.floor(delta / 15);
  for (let k = 1; k <= N; k++) { const at = t + timeAt(k / (N + 1)) * 4; beep(at, 900 + (k % 2) * 140, 520, 0.035, 0.09, 'square'); }
  beep(t, 120, 380, 0.7, 0.09, 'sawtooth');            // раскрутка
  beep(t + 4.05, 260, 140, 0.25, 0.14, 'triangle');    // остановка
}

// ---------- модальные окна ----------
function modal(h){ $('modal').innerHTML = `<div class="sheet">${h}</div>`; $('modal').classList.add('show'); }
function closeModal(){ $('modal').classList.remove('show'); }
$('modal').onclick = e => { if (e.target === $('modal')) closeModal(); };
function confirmM(text, ok, label){
  modal(`<p class="mt">${text}</p><div class="mrow"><button class="mb" id="mno">Отмена</button><button class="mb y" id="myes">${label || 'Подтвердить'}</button></div>`);

// ---------- продажа и покупка ----------
function sellIds(ids){
  const set = new Set(ids), list = mine.filter(i => set.has(i.id)); if (!list.length) return;
  const sum = round2(list.reduce((a,i)=>a+i.p*SELL_RATE,0));
  mine = mine.filter(i => !set.has(i.id)); ids.forEach(id => sel.delete(id));
  balance = round2(balance + sum); save(); buzz('success');
  toast('Продано: +' + fmt(sum)); notify('Продано скинов: ' + list.length + ' на ' + fmt2(sum)); refresh(); if (profOpen) renderProf();
}
function sellAllAsk(){
  if (!mine.length) return;
  const sum = round2(mine.reduce((a,i)=>a+i.p*SELL_RATE,0));
  confirmM(`Продать все предметы (${mine.length}) за ${fmt2(sum)}?`, () => sellIds(mine.map(i => i.id)), 'Продать все');
}
function notify(text){ notifs.unshift({t:text, ts:Date.now(), read:false}); notifs = notifs.slice(0, 30); save(); }
function drawBar(){
  const bb = $('buybar'), inShop = tab === 'mine' && sub === 'shop' && !profOpen;
  let c = cart.find(x => x.id === curId) || cart[cart.length - 1];
  if (c) curId = c.id;
  const show = inShop && !!c;
  bb.classList.toggle('show', show); document.body.classList.toggle('hasbar', show);
  if (!show) return;
  bb.innerHTML = `<div class="bi2">${vis(c)}</div><div class="bt"><b>${esc(title(c))}</b><span>${fmtC(round2(c.p*c.q))}</span></div><div class="bq"><button data-bq="-1" aria-label="Убавить">−</button><b>${c.q}</b><button data-bq="1" aria-label="Добавить">+</button></div><button class="bgo" data-bq="buy">Корзина (${cartQty()})</button>`;
}
$('buybar').onclick = e => {
  const b = e.target.closest('[data-bq]'); if (!b) return;
  if (b.dataset.bq === 'buy') return openCart();
  const c = cart.find(x => x.id === curId); if (!c) return;
  c.q += +b.dataset.bq;
  if (+b.dataset.bq > 0 && c.q <= 99) sfxAdd();
  if (c.q > 99) c.q = 99;
  if (c.q < 1) { cart = cart.filter(x => x !== c); curId = null; }
  render();
};
function cartTotal(){ return round2(cart.reduce((a,i)=>a+i.p*i.q,0)); }
function cartQty(){ return cart.reduce((a,i)=>a+i.q,0); }
function openCart(){
  if (!cart.length) return toast('Корзина пуста — нажмите на скин в магазине');
  const total = cartTotal(), bad = total > balance;
  modal(`<h3>Корзина (${cartQty()})</h3><div class="crt">${cart.map(i => `<div class="crow"><div class="ci">${vis(i)}</div><div class="ct"><b>${title(i)}</b><span>${fmt2(round2(i.p*i.q))}</span></div><div class="qty"><button data-q="${i.id}" data-d="-1" aria-label="Меньше">−</button><b>${i.q}</b><button data-q="${i.id}" data-d="1" aria-label="Больше">+</button></div><button class="rm" data-rm="${i.id}" aria-label="Убрать">✕</button></div>`).join('')}</div>
    <div class="ctot ${bad ? 'bad' : ''}"><span>Итого</span><b>${fmt2(total)} ${hex()}</b></div>
    <p class="ms" style="margin:6px 0 0">Баланс: ${fmtB(balance)}${bad ? ' — не хватает ' + fmt2(round2(total - balance)) : ''}</p>
    <div class="mrow"><button class="mb" id="cno">Отменить</button><button class="mb y" id="cyes">Купить</button></div>`);
  $('modal').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { cart = cart.filter(c => c.id !== +b.dataset.rm); render(); cart.length ? openCart() : closeModal(); });
  $('modal').querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const c = cart.find(c => c.id === +b.dataset.q); if (!c) return; c.q += +b.dataset.d; if (+b.dataset.d > 0 && c.q <= 99) sfxAdd(); if (c.q > 99) c.q = 99; if (c.q < 1) cart = cart.filter(x => x !== c); render(); cart.length ? openCart() : closeModal(); });
  $('cno').onclick = () => { cart = []; closeModal(); toast('Покупка отменена'); render(); };
  $('cyes').onclick = () => {
    if (total > balance) return toast('Недостаточно баланса');
    sfxBuy();
    balance = round2(balance - total); const cnt = cartQty(); cart.forEach(i => { for (let k = 0; k < i.q; k++) { const {q, ...it} = i; mine.push({...it, id: nextId()}); } });
    notify(`Куплено скинов: ${cnt} на ${fmt2(total)}`); toast('Куплено: ' + cnt + ' шт.'); cart = []; save(); closeModal(); refresh();
  };
}

$('fs').onclick = () => { tick(); render(); };
$('cart').onclick = openCart;
$('sl').oninput = e => { add = Math.min(+e.target.value, Math.floor(balance)); refresh(); };

// ---------- иксы и проценты ----------
$('quick').onclick = e => {
  const b = e.target.closest('button'); if (!b || busy) return;
  if (b.id === 'gear') return openSettings();
  const t = b.dataset.t, v = +b.dataset.v; tick();
  if (mode && mode.t === t && mode.v === v) { mode = null; lock = null; return render(); }
  if (!stake()) return toast('Сначала выберите скины или баланс');
  mode = {t, v}; applyMode();
  if (!target) toast('Нет подходящего скина — уменьшите сумму');
  else if (lock == null) toast('Точного скина нет — выбран ближайший');
  render();
};
function openSettings(){
  const inp = (id,v) => `<input id="${id}" type="number" inputmode="decimal" step="any" value="${v}">`;
  modal(`<h3>Настройка иксов</h3><p class="ms">Измените кнопки быстрого выбора. x2 даёт шанс 50%, x9 — 11,11%.</p>
    <div class="mg">${cfg.x.map((v,i)=>`<label>x${inp('sx'+i,v)}</label>`).join('')}</div>
    <div class="mg">${cfg.p.map((v,i)=>`<label>%${inp('sp'+i,v)}</label>`).join('')}</div>
    <div class="mrow"><button class="mb" id="srs">Сбросить</button><button class="mb y" id="ssv">Сохранить</button></div>
    <h3 style="margin-top:20px">Свой икс</h3>
    <div class="mrow" style="margin-top:6px"><input id="cx" type="number" inputmode="decimal" step="any" placeholder="например 9"><button class="mb y" id="cap">Применить</button></div>`);
  const okX = v => v >= 1.05 && v <= 1000, okP = v => v >= .1 && v <= 95;
  $('ssv').onclick = () => {
    const xs = cfg.x.map((_,i) => parseFloat($('sx'+i).value)), ps = cfg.p.map((_,i) => parseFloat($('sp'+i).value));
    if (!xs.every(okX)) return toast('Икс должен быть от 1.05 до 1000');
    if (!ps.every(okP)) return toast('Процент должен быть от 0.1 до 95');
    cfg = {x: xs, p: ps}; mode = null; lock = null; save(); closeModal(); refresh();
  };
  $('srs').onclick = () => { cfg = DEF_CFG(); mode = null; lock = null; save(); closeModal(); refresh(); };
  $('cap').onclick = () => {
    const v = parseFloat($('cx').value);
    if (!okX(v)) return toast('Икс должен быть от 1.05 до 1000');
    closeModal(); if (!stake()) { mode = {t:'x', v}; return toast('Выберите скины или баланс — икс x' + v + ' применится сам'); }
    mode = {t:'x', v}; refresh();
  };
}

// ---------- апгрейд ----------
$('go').onclick = () => {
  if (busy || !target) return; busy = true; render(); buzz('warning');
  const ch = chance(), angle = Math.random() * 360, tgt = target, ad = add, ids = new Set(sel);
  const win = angle <= ch/100*180 || angle >= 360 - ch/100*180;
  const r0 = rot; rot += 360*5 + (360 - rot % 360) + angle; sfxSpin(rot - r0);
  $('ptr').style.transform = `rotate(${rot}deg)`;
  setTimeout(() => {
    mine = mine.filter(i => !ids.has(i.id)); balance = Math.max(0, round2(balance - ad));
    stats.up++;
    if (win) {
      stats.win++; mine.push({...tgt, id: nextId()}); shareDrop(tgt);
      if (!stats.best || tgt.p > stats.best.p) stats.best = {...tgt};
      toast('Победа! ' + tgt.n + ' в инвентаре'); notify('Выигрыш: ' + title(tgt) + ' · ' + fmt2(tgt.p));
    } else { toast('Не повезло. Попробуйте ещё'); notify('Апгрейд не удался: ' + title(tgt)); }
    save(); sel.clear(); add = 0; target = null; lock = null; busy = false; refresh();
  }, 4200);
};

// ---------- «Последние выпадения» (видят все) ----------
// DROPS_API — адрес вашего сервера. GET отдаёт массив [{id,user,t,n,w,p,c,g,img,ts}] (новые первыми), POST принимает такой же объект.
// Пока адрес пустой, лента работает в демо-режиме: чужие выпадения имитируются.
const DROPS_API = '';
const feedSeen = new Set(); let feedTimer = null;
const cleanDrop = d => {
  if (!d || typeof d !== 'object') return null;
  const p = Number(d.p); if (!isFinite(p) || p <= 0 || !d.n) return null;
  return {id: String(d.id == null ? d.ts + d.user + d.n : d.id), user: String(d.user || 'Игрок').slice(0, 20), t: String(d.t || '').slice(0, 40), n: String(d.n).slice(0, 40),
    w: d.w ? String(d.w).slice(0, 3) : undefined, p, c: /^#[0-9a-f]{3,8}$/i.test(d.c || '') ? d.c : '#4a6df0', g: d.g === 'p' || d.g === 's' ? d.g : 'r',
    img: /^https?:\/\//i.test(d.img || '') ? d.img : undefined, x: d.x ? esc(String(d.x).slice(0, 3)) : undefined};
};
function dropHtml(d, me){
  return `<div class="fd ${me ? 'me' : ''}" style="--c:${d.c}" title="${esc(d.user)} — ${esc(title(d))}"><div class="fi">${vis(d)}</div><div class="fx"><div class="fp">${fmtC(d.p)}</div><div class="fn">${esc(d.n)}</div><div class="fu">${me ? 'Вы' : esc(d.user)}</div></div></div>`;
}
function addDrop(d, me){
  if (feedSeen.has(d.id)) return; feedSeen.add(d.id);
  const ft = $('ft'); ft.insertAdjacentHTML('afterbegin', dropHtml(d, me));
  while (ft.children.length > 30) ft.lastElementChild.remove();
}
async function pollDrops(){
  try {
    const a = await (await fetch(DROPS_API)).json();
    (Array.isArray(a) ? a : []).slice(0, 30).reverse().forEach(x => { const d = cleanDrop(x); if (d) addDrop(d, d.user === uname); });
  } catch (e) {}
}
function shareDrop(it){
  const d = {id: 'd' + nextId(), user: uname, t: it.t, n: it.n, w: it.w, p: it.p, c: col(it), g: it.g, img: it.img, x: it.x, ts: Date.now()};
  if (DROPS_API) fetch(DROPS_API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(d)}).then(pollDrops).catch(() => {});
  else addDrop(d, true);
}
function startFeed(){
  if (feedTimer) return;
  if (DROPS_API) { $('fdemo').style.display = 'none'; pollDrops(); feedTimer = setInterval(() => { if (!document.hidden) pollDrops(); }, 5000); return; }
  const pool = shop.slice().sort((a,b) => a.p - b.p), names = ['Alex_77','Nikita','Dimon','Kirill','vladimir','Max','Sasha','Egor','Artem','Tolik','Dana','Ivan','Lyoha','Roma','Slava','Zhenya'];
  const make = () => { const it = pool[Math.floor(Math.pow(Math.random(), 2.6) * pool.length)]; return {id: 'd' + nextId(), user: names[Math.floor(Math.random() * names.length)], t: it.t, n: it.n, w: it.w, p: it.p, c: col(it), g: it.g, img: it.img, x: it.x}; };
  for (let i = 0; i < 10; i++) addDrop(make());
  const loop = () => { addDrop(make()); feedTimer = setTimeout(loop, 2500 + Math.random() * 4500); };
  feedTimer = setTimeout(loop, 3000);
}

// ---------- профиль ----------
const avHtml = () => esc(uname[0].toUpperCase());
function paintUser(){ $('pav').textContent = uname[0].toUpperCase(); $('pname').textContent = uname; }
paintUser();
function openProf(){ profOpen = true; $('prof').style.display = 'block'; renderProf(); }
function closeProf(){ profOpen = false; $('prof').style.display = 'none'; render(); }
$('pbtn').onclick = openProf;
function renameAsk(){
  modal(`<h3>Ваш ник</h3><div class="mrow" style="margin-top:6px"><input id="nn" maxlength="20" value="${esc(uname)}"><button class="mb y" id="nsv">Сохранить</button></div>`);
  $('nsv').onclick = () => { const v = $('nn').value.trim(); if (!v) return toast('Введите ник'); uname = v.slice(0, 20); save(); paintUser(); closeModal(); if (profOpen) renderProf(); };
}
function renderProf(){
  const wr = stats.up ? Math.round(stats.win / stats.up * 100) : 0, b = stats.best;
  const inv = mine.slice().sort((a,c) => c.p - a.p), worth = round2(inv.reduce((a,i)=>a+i.p*SELL_RATE,0));
  $('prof').innerHTML = `
    <div class="ph"><button data-a="back">‹ Назад</button><b>Профиль</b><span></span></div>
    <div class="pu"><div class="av big">${avHtml()}</div><div><div class="pn">${esc(uname)} <button class="ren" data-a="rename" aria-label="Изменить ник">✎</button></div><div class="ps">Баланс: <b>${fmt2(balance)}</b> ${hex('#fad40a')}</div></div></div>
    <div class="tiles"><div class="tile"><span>Апгрейдов</span><b>${stats.up}</b></div><div class="tile"><span>Побед</span><b>${stats.win}</b></div><div class="tile"><span>Винрейт</span><b>${wr}%</b></div></div>
    <div class="best" ${b ? `style="--c:${col(b)}"` : ''}>${b ? `<div class="bi">${vis(b)}</div><div><small>Самый дорогой дроп</small><b>${title(b)}</b><span class="bp">${fmt2(b.p)} ${hex('#fad40a')}</span></div>` : '<div><small>Самый дорогой дроп</small><b>Пока нет побед</b></div>'}</div>
    <div class="ih"><span>Мои скины (${inv.length})${inv.length ? ' · ' + fmt(worth) : ''}</span><button data-a="sellall" ${inv.length ? '' : 'disabled'}>Продать все</button></div>
    <div class="list pl">${inv.map(i => `<div class="pc"><div class="sk" style="--c:${col(i)}"><div class="pr">${fmtC(i.p)} ${hex('#fad40a')}</div>${i.w?`<div class="w">${i.w}</div>`:''}<div class="im">${vis(i)}</div><div class="t">${i.t}</div><div class="n">${i.n}</div></div><button class="sellone" data-a="sell" data-id="${i.id}">Продать</button></div>`).join('') || '<div class="empty">Скинов пока нет</div>'}</div>`;
}
$('prof').onclick = e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a;
  if (a === 'back') closeProf(); else if (a === 'sellall') sellAllAsk(); else if (a === 'sell') sellIds([+b.dataset.id]); else if (a === 'rename') renameAsk();
};

render();
loadSkins();
if (firstVisit) { notify('Бонус 50 000 начислен за регистрацию'); render(); setTimeout(() => toast('Добро пожаловать! На баланс начислено 50 000'), 700); }
</script>
